<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highland Mayfields — The Estate Hub</title>

<!-- ============================================================
     HIGHLAND MAYFIELDS · HOME — "The Estate Hub"
     8-tower premium township · Sector 118, Mohali.
     All design tokens come from the shared brand pack (kd Law 2).
     This file adds ONLY layout, choreography and wiring on top.
     Works standalone (open this file) AND inside a full-screen iframe.
     ============================================================ -->
<link rel="stylesheet" href="styles/brand.css">

<style>
/* ------------------------------------------------------------------
   1 · STAGE SHELL
   .hm-stage is fixed inset:0 (from brand.css). Inside it lives a single
   flex COLUMN that always fits the viewport height — a flexible spacer
   pushes the gateway row to the lower portion, so nothing ever top-cuts
   or vertically clips. No fixed px heights on structural blocks.
------------------------------------------------------------------ */
.stage-col{
  position:absolute; inset:0;
  display:flex; flex-direction:column;
  padding: clamp(.9rem, 2.2vh, 2rem) var(--pad-stage) clamp(.7rem, 1.8vh, 1.4rem);
  z-index:2;                 /* above backdrop layers */
  pointer-events:none;       /* re-enabled per interactive child */
}
.stage-col > *{ pointer-events:auto; }

/* ------------------------------------------------------------------
   2 · BACKDROP — two stacked images for a 1.2s crossfade between
   day & dusk skins, each inside a Ken-Burns frame (slow scale push).
   Graceful fallback: webp→jpg→espresso ground + faint quatrefoil.
------------------------------------------------------------------ */
.backdrop{ position:absolute; inset:-1.6%; overflow:hidden; background:var(--bg-deep); z-index:0; }
.kb{                                   /* Ken-Burns moving frame */
  position:absolute; inset:-2%;        /* slight bleed so edges never show */
  background-size:cover; background-position:50% 48%;
  will-change:transform, opacity;
  opacity:0; transition:opacity 1.2s var(--ease-soft);
  animation: kenburns 26s ease-in-out infinite alternate;
}
.kb.is-active{ opacity:1; }
@keyframes kenburns{
  0%   { transform:scale(1.0)  translate3d(0,0,0); }
  100% { transform:scale(1.06) translate3d(-1.2%, -1%, 0); }
}

/* readability + mood overlays (colours derived from tokens via color-mix) */
.backdrop::after{
  content:""; position:absolute; inset:0; z-index:1; pointer-events:none;
  background:
    /* top scrim for the eyebrow / lockup */
    linear-gradient(to bottom,
       color-mix(in srgb, var(--hm-espresso-2) 62%, transparent) 0%,
       transparent 22%),
    /* lower scrim carrying the gateway tiles */
    linear-gradient(to top,
       color-mix(in srgb, var(--hm-espresso-2) 84%, transparent) 0%,
       color-mix(in srgb, var(--hm-espresso-2) 34%, transparent) 30%,
       transparent 58%),
    /* espresso cinematic vignette */
    radial-gradient(135% 120% at 50% 42%,
       transparent 52%,
       color-mix(in srgb, var(--hm-espresso-2) 70%, transparent) 100%);
}

/* faint vertical gold hairline grid — signature brand motif, very quiet */
.grid-motif{
  position:absolute; inset:0; z-index:1; pointer-events:none; opacity:.5;
  background-image:
    linear-gradient(90deg, var(--hairline-soft) 1px, transparent 1px),
    linear-gradient(90deg, var(--hairline-soft) 1px, transparent 1px);
  background-size: 33.33% 100%, 16.66% 100%;
  background-position: 0 0;
  -webkit-mask-image:linear-gradient(to bottom, transparent, black 18%, black 60%, transparent 92%);
          mask-image:linear-gradient(to bottom, transparent, black 18%, black 60%, transparent 92%);
}

/* film grain (neutral SVG noise, no colour) */
.grain{
  position:absolute; inset:0; z-index:1; pointer-events:none;
  opacity:.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  background-size:200px 200px;
}

/* fallback ground (shown only if BOTH image formats 404) */
.backdrop-fallback{
  position:absolute; inset:0; z-index:0; display:none;
  background:
    radial-gradient(120% 100% at 50% 30%, color-mix(in srgb, var(--hm-espresso) 100%, transparent), var(--bg-deep));
}
.backdrop.no-img .backdrop-fallback{ display:block; }
.backdrop-fallback svg{ position:absolute; inset:0; width:100%; height:100%; opacity:.10; }

/* ------------------------------------------------------------------
   3 · TOP BAR  — eyebrow · centred lockup · day/dusk + enquire
------------------------------------------------------------------ */
.topbar{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
  gap:1rem; width:100%;
}
.topbar .loc{ justify-self:start; opacity:0; }
.topbar .brand{ justify-self:center; opacity:0; }
.topbar .tools{ justify-self:end; display:flex; align-items:center; gap:clamp(.5rem,1.1vw,1rem); opacity:0; }

.loc-line{ display:flex; align-items:center; gap:.7em; }
.loc-line .tick{ width:26px; height:1px; background:var(--accent); opacity:.6; }

.lockup{ height:clamp(34px, 4.6vh, 54px); width:auto; display:block;
         filter:drop-shadow(0 2px 10px color-mix(in srgb, var(--hm-espresso-2) 60%, transparent)); }
.lockup-fallback{ display:none; font-family:var(--font-display); font-weight:600;
  font-size:clamp(1.1rem,2vw,1.7rem); color:var(--ink); letter-spacing:.04em; white-space:nowrap; }

/* day/dusk toggle — a tiny sun/moon hairline switch */
.skin-toggle{
  position:relative; display:inline-flex; align-items:center; gap:.6em;
  min-height:44px; min-width:44px; padding:.5em .9em;
  background:transparent; border:0; cursor:pointer; color:var(--ink-dim);
  font-family:var(--font-label); font-size:var(--t-micro);
  letter-spacing:var(--track-wide); text-transform:uppercase;
  -webkit-tap-highlight-color:transparent;
}
.skin-toggle .ico{ width:18px; height:18px; display:block; transition:opacity .4s var(--ease-soft); }
.skin-toggle .ico.moon{ position:absolute; opacity:0; }
.skin-toggle[data-skin="night"] .ico.sun{ opacity:0; }
.skin-toggle[data-skin="night"] .ico.moon{ opacity:1; }
.skin-toggle .lbl{ min-width:3.4em; text-align:left; }
@media (hover:hover){ .skin-toggle:hover{ color:var(--ink); } }

/* enquire ghost button (reuse brand .hm-enter visual language, lighter) */
.enquire{
  min-height:44px; padding:.7em 1.4em; font-size:var(--t-micro);
  letter-spacing:var(--track-wide); padding-top:.85em; padding-bottom:.85em;
}

.divider{ width:1px; height:22px; background:var(--hairline); opacity:.7; }

/* ------------------------------------------------------------------
   4 · HERO LINE
------------------------------------------------------------------ */
.hero{ text-align:center; margin-top:clamp(1rem, 3.4vh, 2.6rem); }
.hero .presents{ opacity:0; display:inline-block; }
.hero .tagline{
  margin:.5em 0 0; opacity:0;
  font-family:var(--font-body); font-style:italic;
  font-size:var(--t-title); line-height:1.05; color:var(--ink);
  letter-spacing:.012em;
}
.hero .tagline .amp{ color:var(--accent-soft); }

/* flexible spacer — pushes the gateway down to the lower band */
.spacer{ flex:1 1 auto; min-height:clamp(.5rem, 2vh, 2rem); }

/* ------------------------------------------------------------------
   5 · GATEWAY TILES — the centrepiece (the one detail at 120%)
   Row of 7 tall portrait cards. Width distributes fluidly; height is a
   vh-fraction (never a fixed crop). object-fit:cover absorbs any thumb
   aspect. Hover/tap-focus = lift + brighten + slow-zoom + ONE foil sheep
   sweep, while siblings dim & desaturate (master-detail focus).
------------------------------------------------------------------ */
.gateway-wrap{ width:100%; }
.gateway{
  display:flex; justify-content:center; align-items:flex-end;
  gap:clamp(.5rem, 1vw, 1.1rem);
  width:100%;
}
.tile{
  /* fluid width: fill & distribute, capped so 4K never balloons */
  flex:1 1 0; min-width:0; max-width:clamp(150px, 14vw, 320px);
  /* height = a fraction of available height, clamped — no crop */
  height:clamp(190px, 40vh, 540px);
  position:relative; display:block; padding:0; cursor:pointer;
  background:var(--bg-deep); border:0; border-radius:var(--r-tile);
  overflow:hidden; color:var(--ink); text-align:left;
  -webkit-tap-highlight-color:transparent;
  /* entrance start state (revealed via .reveal on load) */
  opacity:0; transform:translateY(26px);
  transition:
    transform .7s var(--ease-settle),
    opacity   .7s var(--ease-settle),
    filter    .5s var(--ease-soft);
}
.tile.reveal{ opacity:1; transform:translateY(0); }

/* gold hairline frame */
.tile .frame{
  position:absolute; inset:0; z-index:3; pointer-events:none;
  border:1px solid var(--hairline); border-radius:var(--r-tile);
  transition:border-color .5s var(--ease-soft),
             box-shadow .6s var(--ease-soft);
}

/* the render thumb */
.tile .thumb{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  object-position:50% 42%;
  filter:saturate(.92) brightness(.84);
  transform:scale(1.001);
  transition:transform 1.2s var(--ease-settle),
             filter .6s var(--ease-soft);
  will-change:transform;
}
/* per-tile fallback wash if a thumb 404s */
.tile.no-img .thumb{ display:none; }
.tile .thumb-fallback{
  position:absolute; inset:0; z-index:0; display:none;
  background:
    radial-gradient(120% 90% at 50% 30%,
      color-mix(in srgb, var(--hm-espresso) 92%, var(--hm-gold) 8%),
      var(--bg-deep));
}
.tile.no-img .thumb-fallback{ display:block; }
.tile .thumb-fallback::after{          /* faint quatrefoil glyph — token-coloured via mask */
  content:""; position:absolute; inset:0; opacity:.14; background:var(--hm-gold);
  -webkit-mask:no-repeat center/42% url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='black' stroke-width='1.4'><circle cx='50' cy='32' r='15'/><circle cx='50' cy='68' r='15'/><circle cx='32' cy='50' r='15'/><circle cx='68' cy='50' r='15'/></g></svg>");
          mask:no-repeat center/42% url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='none' stroke='black' stroke-width='1.4'><circle cx='50' cy='32' r='15'/><circle cx='50' cy='68' r='15'/><circle cx='32' cy='50' r='15'/><circle cx='68' cy='50' r='15'/></g></svg>");
}

/* darkening gradient + label block at the bottom */
.tile .cap{
  position:absolute; left:0; right:0; bottom:0; z-index:2;
  padding:clamp(.7rem,1.4vw,1.15rem) clamp(.7rem,1.2vw,1rem);
  background:linear-gradient(to top,
    color-mix(in srgb, var(--hm-espresso-2) 92%, transparent) 0%,
    color-mix(in srgb, var(--hm-espresso-2) 52%, transparent) 46%,
    transparent 100%);
}
.tile .cap .idx{
  font-family:var(--font-label); font-size:var(--t-label);
  letter-spacing:var(--track-label); text-transform:uppercase;
  color:var(--accent); display:block; margin-bottom:.35em;
}
.tile .cap .ttl{
  font-family:var(--font-display); font-weight:500; line-height:1.04;
  font-size:clamp(1.05rem, 1.5vw, 1.7rem); color:var(--ink);
  /* foil sheen plumbing (sweeps once on focus) */
  background-image:linear-gradient(105deg,transparent 38%,var(--hm-gold-bright) 50%,transparent 62%);
  background-size:230% 100%; background-repeat:no-repeat;
  background-position:-130% 0;
  -webkit-background-clip:text; background-clip:text;
}
.tile .cap .ttl .sub{ display:block; font-size:.62em; color:var(--ink-dim);
  font-family:var(--font-body); font-style:italic; letter-spacing:.01em; margin-top:.15em; }

/* a thin foil baseline that draws in on focus */
.tile .cap::after{
  content:""; position:absolute; left:clamp(.7rem,1.2vw,1rem); bottom:clamp(.5rem,1vw,.8rem);
  height:1px; width:0;
  background:linear-gradient(90deg, var(--accent), transparent);
  transition:width .7s var(--ease-settle);
}

/* ---- FOCUS / HOVER CHOREOGRAPHY ---- */
/* lift + zoom the focused tile; sweep foil through its title once */
.tile.is-focus{ transform:translateY(-10px) scale(1.03); z-index:5; }
.tile.is-focus .thumb{ filter:saturate(1.04) brightness(1.04); transform:scale(1.08); }
.tile.is-focus .frame{
  border-color:var(--accent);
  box-shadow:
    0 18px 46px -14px color-mix(in srgb, var(--hm-espresso-2) 90%, transparent),
    inset 0 0 0 1px color-mix(in srgb, var(--hm-gold) 30%, transparent);
}
.tile.is-focus .cap::after{ width:48%; }
.tile.is-focus .cap .ttl{ animation:hm-sheen 1.05s var(--ease-soft) forwards; }

/* siblings recede when one tile is focused */
.gateway.has-focus .tile:not(.is-focus){ opacity:.6; filter:saturate(.6) brightness(.82); }

/* keyboard focus ring */
.tile:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

/* idle attract: gentle breathing hint when untouched */
@keyframes hm-breathe{
  0%,100%{ box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hm-gold) 0%,transparent); }
  50%    { box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hm-gold) 26%,transparent); }
}
.gateway.attract .tile .frame{ animation:hm-breathe 3.4s var(--ease-soft) infinite; }
.gateway.attract .tile:nth-child(2) .frame{ animation-delay:.28s; }
.gateway.attract .tile:nth-child(3) .frame{ animation-delay:.56s; }
.gateway.attract .tile:nth-child(4) .frame{ animation-delay:.84s; }
.gateway.attract .tile:nth-child(5) .frame{ animation-delay:1.12s; }
.gateway.attract .tile:nth-child(6) .frame{ animation-delay:1.40s; }
.gateway.attract .tile:nth-child(7) .frame{ animation-delay:1.68s; }

/* ------------------------------------------------------------------
   6 · FOOTER
------------------------------------------------------------------ */
.footer{
  display:flex; justify-content:space-between; align-items:flex-end;
  width:100%; margin-top:clamp(.5rem,1.4vh,1rem); opacity:0;
}
.footer .rera{
  font-family:var(--font-label); font-size:var(--t-micro);
  letter-spacing:var(--track-wide); text-transform:uppercase; color:var(--ink-dim);
}
.footer .ver{ font-family:var(--font-label); font-size:8px;
  letter-spacing:var(--track-wide); color:var(--ink); opacity:.4; }

/* ------------------------------------------------------------------
   7 · ENTRANCE TIMELINE  (staggered, expoOut, no bounce)
------------------------------------------------------------------ */
@keyframes hm-rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:translateY(0); } }
.lit{ animation:hm-rise var(--dur-reveal) var(--ease-settle) forwards; }

/* ------------------------------------------------------------------
   8 · SECTION PLACEHOLDER  (premium stand-in until screens are built)
------------------------------------------------------------------ */
.section-veil{
  position:absolute; inset:0; z-index:40; display:none;
  background:var(--bg-deep); color:var(--ink);
  align-items:center; justify-content:center; text-align:center;
}
.section-veil.show{ display:flex; }
.section-veil .inner{ opacity:0; transform:translateY(14px); }
.section-veil.show .inner{ animation:hm-rise 1s var(--ease-settle) .35s forwards; }
.section-veil .crest{ width:clamp(54px,7vw,86px); height:auto; opacity:.9; margin:0 auto 1.4rem;
  display:block; filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--hm-espresso-2) 70%,transparent)); }
.section-veil .crest-fallback{ display:none; }
.section-veil .eyebrow-sm{ display:block; margin-bottom:1rem; }
.section-veil .big{
  font-family:var(--font-display); font-weight:500; line-height:1.05;
  font-size:var(--t-hero); color:var(--ink); margin:0;
}
.section-veil .soon{ display:block; margin-top:.4em; font-size:.34em; color:var(--ink-dim);
  font-style:italic; font-family:var(--font-body); letter-spacing:.04em; }
.section-veil .veil-rule{ width:min(340px,50vw); margin:1.8rem auto; }
.section-veil .back{
  margin-top:1.6rem; gap:.8em;
}
.section-veil .back .arrow{ display:inline-block; }

/* gold light-wipe that sweeps across once on transition */
.wipe{
  position:absolute; inset:0; z-index:60; pointer-events:none;
  transform:translateX(-110%);
  background:linear-gradient(105deg,
     transparent 0%,
     color-mix(in srgb, var(--hm-gold) 14%, transparent) 38%,
     color-mix(in srgb, var(--hm-gold-bright) 55%, transparent) 50%,
     color-mix(in srgb, var(--hm-gold) 14%, transparent) 62%,
     transparent 100%);
}
.wipe.run{ animation:hm-wipe 1.05s var(--ease-settle) forwards; }
@keyframes hm-wipe{ 0%{ transform:translateX(-110%);} 100%{ transform:translateX(110%);} }

/* ------------------------------------------------------------------
   9 · RESPONSIVE — below 900px reflow tiles to a horizontal snap-scroll
   row (fixed-width cards) so they never overflow or clip vertically.
------------------------------------------------------------------ */
@media (max-width:900px){
  .gateway{
    justify-content:flex-start; align-items:stretch;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    padding-bottom:.4rem;
    /* fade the scroll edges */
    -webkit-mask-image:linear-gradient(90deg,transparent,black 4%,black 96%,transparent);
            mask-image:linear-gradient(90deg,transparent,black 4%,black 96%,transparent);
  }
  .gateway::-webkit-scrollbar{ height:0; }
  .tile{
    flex:0 0 auto; width:clamp(150px, 42vw, 220px);
    max-width:none; height:clamp(220px, 50vh, 360px);
    scroll-snap-align:center;
  }
  .gateway.has-focus .tile:not(.is-focus){ opacity:1; filter:none; } /* no dim while scrolling */
}

/* very wide & short safety (e.g. 65" used in odd ratios) */
@media (min-aspect-ratio:2/1){
  .tile{ height:clamp(190px, 46vh, 520px); }
}

/* honour reduced motion (brand.css already damps durations) */
@media (prefers-reduced-motion:reduce){
  .kb{ animation:none; }
  .gateway.attract .tile .frame{ animation:none; }
  .tile.is-focus .cap .ttl{ animation:none; }
}
</style>
</head>

<body>
<main class="hm-stage" role="application" aria-label="Highland Mayfields — Estate Hub">

  <!-- ====== BACKDROP LAYERS ====== -->
  <div class="backdrop" id="backdrop">
    <div class="kb" id="kbDay"   data-skin="day"></div>
    <div class="kb"          id="kbNight" data-skin="night"></div>
    <div class="grid-motif"></div>
    <div class="grain"></div>
    <div class="backdrop-fallback" aria-hidden="true">
      <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
        <g fill="none" stroke="var(--hm-gold)" stroke-width=".5">
          <circle cx="50" cy="38" r="9"/><circle cx="50" cy="62" r="9"/>
          <circle cx="38" cy="50" r="9"/><circle cx="62" cy="50" r="9"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- ====== CONTENT COLUMN ====== -->
  <div class="stage-col">

    <!-- TOP BAR -->
    <header class="topbar">
      <div class="loc">
        <div class="loc-line">
          <span class="tick" aria-hidden="true"></span>
          <span class="hm-eyebrow">Sector 118 · Airport Road · Mohali</span>
        </div>
      </div>

      <div class="brand">
        <img class="lockup" id="lockup" src="assets/logo-lockup-light.png"
             alt="Highland Mayfields" width="2000" height="765">
        <span class="lockup-fallback" id="lockupFallback">Highland&nbsp;Mayfields</span>
      </div>

      <div class="tools">
        <!-- DAY / DUSK toggle -->
        <button class="skin-toggle" id="skinToggle" data-skin="day"
                type="button" aria-label="Toggle day or dusk view">
          <svg class="ico sun" viewBox="0 0 24 24" fill="none"
               stroke="var(--accent)" stroke-width="1.2" aria-hidden="true">
            <circle cx="12" cy="12" r="4.2"/>
            <g stroke-linecap="round">
              <path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/>
            </g>
          </svg>
          <svg class="ico moon" viewBox="0 0 24 24" fill="none"
               stroke="var(--accent)" stroke-width="1.2" aria-hidden="true">
            <path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z" stroke-linejoin="round"/>
          </svg>
          <span class="lbl" id="skinLabel">Day</span>
        </button>

        <span class="divider" aria-hidden="true"></span>

        <!-- ENQUIRE -->
        <button class="hm-enter enquire" id="enquire" type="button">Enquire</button>
      </div>
    </header>

    <!-- HERO -->
    <section class="hero">
      <span class="presents hm-eyebrow">The Highland Group Presents</span>
      <p class="tagline">An opulence <span class="amp">of</span> luxury</p>
    </section>

    <div class="spacer"></div>

    <!-- GATEWAY TILES -->
    <nav class="gateway-wrap" aria-label="Estate sections">
      <div class="gateway" id="gateway"><!-- tiles injected by script --></div>
    </nav>

    <!-- FOOTER -->
    <footer class="footer" id="footer">
      <span class="rera">RERA · PBRERA-SAS80-PR1041</span>
      <span class="ver">v0.1</span>
    </footer>
  </div>

  <!-- ====== SECTION PLACEHOLDER VEIL ====== -->
  <div class="section-veil" id="veil" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="inner">
      <img class="crest" id="veilCrest" src="assets/logo-crest.png" alt="" aria-hidden="true">
      <span class="eyebrow-sm hm-eyebrow" id="veilEyebrow">Highland Mayfields</span>
      <h2 class="big" id="veilTitle">
        The Section
        <span class="soon">arriving soon</span>
      </h2>
      <div class="hm-rule veil-rule" aria-hidden="true"></div>
      <button class="hm-enter back" id="veilBack" type="button">
        <span class="arrow" aria-hidden="true">&larr;</span> Return to the Estate
      </button>
    </div>
  </div>

  <!-- gold light-wipe overlay -->
  <div class="wipe" id="wipe" aria-hidden="true"></div>

</main>

<script>
(() => {
  'use strict';

  /* ----------------------------------------------------------------
     A · DATA — the 7 gateways. Keys match the dispatched navigate event.
  ---------------------------------------------------------------- */
  const TILES = [
    { key:'address',    idx:'01', title:'The Address',  sub:'Sector 118',         thumb:'tile-address'   },
    { key:'masterplan', idx:'02', title:'Masterplan',   sub:'The eight towers',   thumb:'tile-masterplan'},
    { key:'residences', idx:'03', title:'Residences',   sub:'Homes of stature',   thumb:'tile-residences'},
    { key:'amenities',  idx:'04', title:'The Pearl',    sub:'Amenities',          thumb:'tile-amenities' },
    { key:'landscape',  idx:'05', title:'Landscape',    sub:'A biophilic estate', thumb:'tile-landscape' },
    { key:'gallery',    idx:'06', title:'Gallery',      sub:'In light & detail',  thumb:'tile-gallery'   },
    { key:'group',      idx:'07', title:'The Highland', sub:'The Group',          thumb:'tile-group'     },
  ];

  const $  = (s, r=document) => r.querySelector(s);

  /* ----------------------------------------------------------------
     B · IMAGE FALLBACK HELPER — webp → jpg → fail-callback.
     (Backdrops & lockup use real files; tiles try webp then jpg.)
  ---------------------------------------------------------------- */
  function loadImageInto(el, base, ext, onfail, asBg){
    // el: <img> or a node to set background-image on (asBg=true)
    const tryExt = (e, triedJpg) => {
      const src = `assets/${base}.${e}`;
      const probe = new Image();
      probe.onload = () => {
        if (asBg) el.style.backgroundImage = `url("${src}")`;
        else el.src = src;
      };
      probe.onerror = () => {
        if (!triedJpg && e !== 'jpg') tryExt('jpg', true);
        else onfail && onfail();
      };
      probe.src = src;
    };
    tryExt(ext, false);
  }

  /* ----------------------------------------------------------------
     C · BACKDROP — pre-decode day skin, then fade it in. Dusk loads lazily.
  ---------------------------------------------------------------- */
  const backdrop = $('#backdrop');
  const kbDay = $('#kbDay'), kbNight = $('#kbNight');

  function setBackdrop(node, base){
    const apply = (src) => {
      node.style.backgroundImage = `url("${src}")`;
      // fade in the day skin on first paint (dusk fades in via toggle)
      if (node === kbDay && skin === 'day') requestAnimationFrame(() => node.classList.add('is-active'));
    };
    const webp = `assets/${base}.webp`;
    const img = new Image();
    img.onload = () => { (img.decode ? img.decode().catch(()=>{}) : Promise.resolve()).finally(()=>apply(webp)); };
    img.onerror = () => {
      const jpg = `assets/${base}.jpg`;
      const img2 = new Image();
      img2.onload = () => apply(jpg);
      img2.onerror = () => { flagBackdropFail(); };
      img2.src = jpg;
    };
    img.src = webp;
  }
  function flagBackdropFail(){ backdrop.classList.add('no-img'); }

  setBackdrop(kbDay, 'home-day');
  // dusk is loaded on first toggle to keep startup light, but prep eagerly after idle
  let nightLoaded = false;
  function ensureNight(){ if (nightLoaded) return; nightLoaded = true; setBackdrop(kbNight, 'home-night'); }

  /* lockup fallback to wordmark text */
  const lockup = $('#lockup');
  lockup.addEventListener('error', () => {
    lockup.style.display = 'none';
    $('#lockupFallback').style.display = 'inline-block';
  });

  /* veil crest fallback */
  const veilCrest = $('#veilCrest');
  veilCrest.addEventListener('error', () => { veilCrest.style.display = 'none'; });

  /* ----------------------------------------------------------------
     D · BUILD TILES
  ---------------------------------------------------------------- */
  const gateway = $('#gateway');
  TILES.forEach((t) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'tile';
    btn.dataset.key = t.key;
    btn.setAttribute('aria-label', `${t.title}${t.sub ? ' — ' + t.sub : ''}`);
    btn.innerHTML = `
      <div class="thumb-fallback" aria-hidden="true"></div>
      <img class="thumb" alt="" aria-hidden="true">
      <div class="cap">
        <span class="idx">${t.idx} / Explore</span>
        <span class="ttl">${t.title}<span class="sub">${t.sub}</span></span>
      </div>
      <div class="frame" aria-hidden="true"></div>`;
    gateway.appendChild(btn);

    // load thumb with fallback
    const img = btn.querySelector('.thumb');
    loadImageInto(img, t.thumb, 'webp', () => btn.classList.add('no-img'), false);
  });
  const tiles = Array.from(gateway.querySelectorAll('.tile'));

  /* focus choreography (pointer + keyboard) — gated for hover devices via CSS,
     but we also drive it on focus so taps/keyboard get the same treatment. */
  function focusTile(tile){
    gateway.classList.add('has-focus');
    tiles.forEach(t => t.classList.toggle('is-focus', t === tile));
  }
  function blurTiles(){
    gateway.classList.remove('has-focus');
    tiles.forEach(t => t.classList.remove('is-focus'));
  }
  const hoverCapable = window.matchMedia('(hover:hover)').matches;
  tiles.forEach(tile => {
    if (hoverCapable){
      tile.addEventListener('pointerenter', () => focusTile(tile));
      tile.addEventListener('pointerleave', blurTiles);
    }
    tile.addEventListener('focus', () => focusTile(tile));
    tile.addEventListener('blur', blurTiles);
    tile.addEventListener('click', () => navigate(tile.dataset.key, tile));
  });

  /* ----------------------------------------------------------------
     E · ENTRANCE TIMELINE — staggered, calm, expoOut.
  ---------------------------------------------------------------- */
  function play(el, delay){ if(el){ el.style.animationDelay = delay + 'ms'; el.classList.add('lit'); } }
  function runIntro(){
    kbDay.classList.add('is-active');
    play($('.topbar .loc'),    250);
    play($('.topbar .brand'),  120);
    play($('.topbar .tools'),  400);
    play($('.hero .presents'), 600);
    play($('.hero .tagline'),  780);
    play($('#footer'),        1500);
    // tiles rise, staggered 100ms
    tiles.forEach((t, i) => setTimeout(() => t.classList.add('reveal'), 950 + i * 105));
  }

  /* ----------------------------------------------------------------
     F · DAY / DUSK TOGGLE — 1.2s crossfade.
  ---------------------------------------------------------------- */
  const skinToggle = $('#skinToggle'), skinLabel = $('#skinLabel');
  let skin = 'day';
  function setSkin(next){
    if (next === skin) return;
    skin = next;
    if (skin === 'night') ensureNight();
    const isNight = skin === 'night';
    kbNight.classList.toggle('is-active', isNight);
    kbDay.classList.toggle('is-active', !isNight);
    skinToggle.dataset.skin = skin;
    skinLabel.textContent = isNight ? 'Dusk' : 'Day';
  }
  skinToggle.addEventListener('click', () => { setSkin(skin === 'day' ? 'night' : 'day'); poke(); });

  /* ----------------------------------------------------------------
     G · SUBTLE PARALLAX — shallow backdrop drift on pointer move
     (hover devices only; never fights the Ken-Burns).
  ---------------------------------------------------------------- */
  if (hoverCapable){
    let raf = 0;
    window.addEventListener('pointermove', (e) => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const dx = (e.clientX / window.innerWidth  - .5);
        const dy = (e.clientY / window.innerHeight - .5);
        const tx = (-dx * 14).toFixed(2), ty = (-dy * 10).toFixed(2);
        backdrop.style.setProperty('transform', `translate3d(${tx}px, ${ty}px, 0)`);
      });
    }, { passive:true });
  }

  /* ----------------------------------------------------------------
     H · NAVIGATION — dispatch event + premium placeholder veil.
  ---------------------------------------------------------------- */
  const veil = $('#veil'), wipe = $('#wipe');
  const veilTitle = $('#veilTitle'), veilEyebrow = $('#veilEyebrow');

  function runWipe(){
    wipe.classList.remove('run');   // restart
    void wipe.offsetWidth;          // reflow
    wipe.classList.add('run');
  }

  function navigate(key, tile){
    poke();
    const data = TILES.find(t => t.key === key);
    // let host app / future router hook in
    window.dispatchEvent(new CustomEvent('hm:navigate', { detail:{ key } }));

    // light-wipe, then reveal the placeholder mid-sweep
    runWipe();
    setTimeout(() => {
      veilEyebrow.textContent = data ? `${data.idx} · Highland Mayfields` : 'Highland Mayfields';
      veilTitle.innerHTML = `${data ? data.title : 'The Section'}<span class="soon">arriving soon</span>`;
      veil.classList.add('show');
      veil.setAttribute('aria-hidden', 'false');
      $('#veilBack').focus({ preventScroll:true });
    }, 360);
  }

  function closeVeil(){
    runWipe();
    setTimeout(() => {
      veil.classList.remove('show');
      veil.setAttribute('aria-hidden', 'true');
      blurTiles();
    }, 360);
  }
  $('#veilBack').addEventListener('click', closeVeil);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && veil.classList.contains('show')) closeVeil();
  });

  /* ENQUIRE — surfaced as its own navigate intent */
  $('#enquire').addEventListener('click', () => {
    poke();
    window.dispatchEvent(new CustomEvent('hm:navigate', { detail:{ key:'enquire' } }));
    runWipe();
    setTimeout(() => {
      veilEyebrow.textContent = 'Speak with us';
      veilTitle.innerHTML = `Enquire<span class="soon">arriving soon</span>`;
      veil.classList.add('show');
      veil.setAttribute('aria-hidden', 'false');
      $('#veilBack').focus({ preventScroll:true });
    }, 360);
  });

  /* ----------------------------------------------------------------
     I · IDLE ATTRACT LOOP — after 12s of no interaction, breathe the
     tile frames so the screen never feels dead. Any input cancels it.
  ---------------------------------------------------------------- */
  let idleTimer = 0;
  function poke(){
    gateway.classList.remove('attract');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!veil.classList.contains('show')) gateway.classList.add('attract');
    }, 12000);
  }
  ['pointerdown','pointermove','keydown','wheel','touchstart'].forEach(ev =>
    window.addEventListener(ev, poke, { passive:true }));

  /* ----------------------------------------------------------------
     J · BOOT
  ---------------------------------------------------------------- */
  function boot(){
    runIntro();
    poke();
    // warm the dusk skin once the screen has settled
    setTimeout(ensureNight, 4000);
  }
  if (document.readyState === 'complete' || document.readyState === 'interactive') boot();
  else window.addEventListener('DOMContentLoaded', boot);

})();
</script>
</body>
</html>
