<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Living Tree · The Residence</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #050a07; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  * { box-sizing: border-box; }

  /* Stage fits viewport with letterboxing */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at center, #0a120d 0%, #050a07 80%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    box-shadow: 0 60px 140px rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
  }

  /* ====== KEYFRAMES ====== */
  @keyframes leafFall {
    0%   { transform: translate(0, 0) rotate(var(--rotS)); }
    100% { transform: translate(var(--driftX), calc(100vh + 80px)) rotate(var(--rotE)); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.55; }
    50%      { transform: scale(1.04); opacity: 0.85; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes treeDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes dashIn {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes fadeInOpacity {
    from { opacity: 0; }
    to   { opacity: 0.85; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleFadeIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes springIn {
    0%   { transform: scale(0.5); }
    100% { transform: scale(1); }
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes kenBurns {
    0%   { transform: scale(1.0) translate(0, 0); }
    50%  { transform: scale(1.08) translate(-1%, -1.5%); }
    100% { transform: scale(1.0) translate(0, 0); }
  }
  .canopyBg { animation: kenBurns 36s ease-in-out infinite; }
</style>
<script>
  // Stage scaling — plain JS, runs reliably
  (function() {
    const W = 1440, H = 900;
    function scale() {
      const wrap = document.getElementById("stage-wrap");
      const stage = document.getElementById("stage");
      if (!wrap || !stage) return;
      const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.__ltScale = scale;
    window.addEventListener("resize", scale);
    document.addEventListener("DOMContentLoaded", scale);
    window.addEventListener("load", scale);
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="stage-wrap">
  <div id="stage"></div>
</div>

<script type="text/babel" src="icons.jsx?v=4"></script>
<script type="text/babel" src="dock-icons.jsx?v=4"></script>
<script type="text/babel" src="experience.jsx?v=4"></script>
<script type="text/babel">
  ReactDOM.createRoot(document.getElementById("stage")).render(<LivingTreeExperience />);
  if (window.__ltScale) window.__ltScale();
</script>
</body>
</html>
