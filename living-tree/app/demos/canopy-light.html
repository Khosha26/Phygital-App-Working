<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Living Tree · Canopy Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<!--
  CANOPY LIGHT  ·  alternate home-screen direction for Living Tree by Kalyani Developers
  Concept: you stand inside the LivingTree forest, looking up through the canopy toward
  warm light. The 11 modules are luminous PORTAL nodes floating at staggered depths
  among the leaves. Soft parallax, drifting light, slow ambient bob.
  Design canvas: 2560x1600, auto-fit-scaled and letterboxed.
-->
<style>
  :root {
    --forest-deep: #1c2a1a;
    --forest:      #2f4326;
    --gold:        #c9a865;
    --gold-bright: #e8d8a8;
    --cream:       #f3ead3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #10160d;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #viewport {
    position: fixed; inset: 0;
    overflow: hidden;
    background: #10160d;
  }
  /* fixed 2560x1600 design stage, JS scales it to fit + centers it */
  #stage {
    position: absolute;
    top: 50%; left: 50%;
    width: 2560px; height: 1600px;
    overflow: hidden;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    background: #10160d;
  }
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ---------------------- auto-fit-scale ---------------------- */
function useFitScale(w, h) {
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const fit = () => setScale(Math.min(window.innerWidth / w, window.innerHeight / h));
    fit();
    window.addEventListener('resize', fit);
    return () => window.removeEventListener('resize', fit);
  }, [w, h]);
  return scale;
}

/* ---------------------- module data ----------------------
   Positions tuned over the canopy image: warm glow sits upper-centre.
   depth: 0 = near (large, sharp) - 1 = mid - 2 = far (small, soft).
   xy in stage px (2560x1600). Organic scatter that keeps Project
   Overview nearest the central glow and the 3 utilities low + small. */
const MODULES = [
  { id: 1,  label: 'Project Overview',  sub: 'The story, in one screen',   x: 1280, y: 552,  depth: 0, size: 1.28, hero: true },
  { id: 2,  label: 'Gallery',           sub: 'Renders & walkthroughs',     x: 758,  y: 432,  depth: 1, size: 0.78 },
  { id: 3,  label: 'Masterplan',        sub: 'Site plan - ten towers',     x: 1830, y: 440,  depth: 1, size: 0.80 },
  { id: 4,  label: 'Inventory',         sub: 'Available units, live',      x: 1108, y: 952,  depth: 0, size: 0.92, live: true },
  { id: 5,  label: 'Amenities',         sub: '65 across two clubhouses',   x: 1928, y: 832,  depth: 0, size: 0.86 },
  { id: 6,  label: 'Location Advantage',sub: 'KIADB - 15 min to airport',  x: 470,  y: 770,  depth: 1, size: 0.76 },
  { id: 7,  label: 'Floor Plan',        sub: '1 - 2 - 2.5 - 3 BHK',        x: 1640, y: 1018, depth: 0, size: 0.88 },
  { id: 8,  label: 'Booking',           sub: 'Reserve a residence',        x: 792,  y: 1086, depth: 0, size: 0.96, gold: true },
  { id: 9,  label: 'Email Sender',      sub: 'Brochure - quote - receipt', x: 532,  y: 1268, depth: 2, size: 0.58, util: true },
  { id: 10, label: 'GRE',               sub: 'Guest Relations workspace',  x: 1276, y: 1336, depth: 2, size: 0.58, util: true },
  { id: 11, label: 'Mini Dashboard',    sub: 'Live numbers',               x: 2034, y: 1274, depth: 2, size: 0.58, util: true },
];

/* depth parallax multipliers (near layers shift more) */
const DEPTH = {
  0: { drift: 1.0,  blur: 0,    parallax: 34, bob: 16, opacity: 1.00, dim: 1.00 },
  1: { drift: 0.62, blur: 1.6,  parallax: 20, bob: 11, opacity: 0.92, dim: 0.90 },
  2: { drift: 0.34, blur: 3.2,  parallax: 11, bob: 8,  opacity: 0.80, dim: 0.78 },
};

/* ---------------------- drifting motes ---------------------- */
function makeMotes(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    out.push({
      id: i,
      x: Math.random() * 2560,
      y: Math.random() * 1600,
      r: 1.5 + Math.random() * 4.5,
      depth: Math.random() < 0.4 ? 0 : (Math.random() < 0.6 ? 1 : 2),
      sp: 0.10 + Math.random() * 0.34,
      sway: 14 + Math.random() * 46,
      swaySp: 0.10 + Math.random() * 0.35,
      ph: Math.random() * Math.PI * 2,
      glow: 0.30 + Math.random() * 0.55,
    });
  }
  return out;
}

/* ---------------------- one portal node ---------------------- */
function Portal({ m, t, pointer, loaded }) {
  const [hover, setHover] = useState(false);
  const d = DEPTH[m.depth];

  /* ambient bob + slow lateral drift */
  const bobY = Math.sin(t * 0.45 + m.id * 1.7) * d.bob;
  const driftX = Math.cos(t * 0.22 + m.id * 0.9) * d.drift * 9;

  /* pointer parallax */
  const px = -pointer.x * d.parallax;
  const py = -pointer.y * d.parallax;

  /* staggered bloom-in from centre outward */
  const cx = 1280, cy = 800;
  const dist = Math.hypot(m.x - cx, m.y - cy);
  const delay = (dist / 1500) * 1.05;
  const appear = Math.max(0, Math.min(1, (loaded - delay) / 0.9));
  const ease = 1 - Math.pow(1 - appear, 3);

  /* sizing */
  const baseCore = 168 * m.size;
  const coreScale = (hover ? 1.13 : 1) * (0.86 + 0.14 * ease);

  const wrap = {
    position: 'absolute',
    left: m.x, top: m.y,
    transform: `translate(-50%,-50%) translate(${driftX + px}px, ${bobY + py}px)`,
    opacity: d.opacity * ease,
    filter: d.blur ? `blur(${d.blur * (hover ? 0.25 : 1)}px)` : 'none',
    transition: 'filter 0.5s ease',
    cursor: 'pointer',
    zIndex: 100 - m.depth * 10 + (hover ? 50 : 0),
    willChange: 'transform, opacity',
  };

  const orb = {
    position: 'relative',
    width: baseCore, height: baseCore,
    transform: `scale(${coreScale})`,
    transition: 'transform 0.55s cubic-bezier(.2,.8,.2,1)',
    display: 'flex', alignItems: 'center', justifyContent: 'center',
  };

  const haloC = m.gold ? '243,210,140' : '237,222,178';
  /* dark seat behind the orb so it reads against the bright canopy */
  const seat = {
    position: 'absolute', inset: '-78%',
    borderRadius: '50%',
    background: `radial-gradient(circle, rgba(20,28,16,${0.50*d.dim}) 0%, rgba(20,28,16,0.26) 42%, transparent 70%)`,
    pointerEvents: 'none',
  };
  const halo = {
    position: 'absolute', inset: '-135%',
    borderRadius: '50%',
    background: `radial-gradient(circle, rgba(${haloC},${(m.gold?0.62:0.46)*(hover?1.55:1)*d.dim}) 0%, rgba(${haloC},0.16) 40%, transparent 68%)`,
    transition: 'background 0.55s ease',
    mixBlendMode: 'screen',
    pointerEvents: 'none',
  };
  const core = {
    position: 'absolute', inset: '20%',
    borderRadius: '50%',
    background: m.gold
      ? `radial-gradient(circle at 42% 38%,
          rgba(255,250,232,1) 0%,
          rgba(247,224,158,0.98) 30%,
          rgba(214,170,86,0.92) 62%,
          rgba(150,110,48,0.55) 100%)`
      : `radial-gradient(circle at 42% 38%,
          rgba(255,251,236,1) 0%,
          rgba(239,224,180,0.97) 34%,
          rgba(207,176,112,0.82) 66%,
          rgba(132,108,60,0.42) 100%)`,
    boxShadow: `0 0 ${hover?88:58}px ${hover?30:18}px rgba(${haloC},${(m.gold?0.70:0.52)*d.dim}),
                inset 0 0 34px rgba(255,253,242,0.85),
                inset 0 -10px 22px rgba(120,90,40,0.3)`,
    transition: 'box-shadow 0.55s ease',
  };
  const ring = {
    position: 'absolute', inset: '2%',
    borderRadius: '50%',
    border: `2px solid rgba(${m.gold?'247,228,164':'247,238,214'},${(m.gold?0.92:0.72)*d.dim})`,
    boxShadow: m.gold
      ? `0 0 22px rgba(243,210,140,0.7), inset 0 0 14px rgba(255,246,214,0.5)`
      : `0 0 12px rgba(237,222,178,0.4)`,
  };
  const pulse = {
    position: 'absolute', inset: '4%',
    borderRadius: '50%',
    border: '1px solid rgba(243,234,211,0.65)',
    opacity: 0,
    transform: hover ? 'scale(1.85)' : 'scale(1)',
    transition: hover ? 'transform 1.4s ease-out, opacity 1.4s ease-out' : 'none',
    pointerEvents: 'none',
  };
  const pulse2 = { ...pulse,
    opacity: hover ? 0.6 : 0,
    transform: hover ? 'scale(1.55)' : 'scale(1)',
    transition: hover ? 'transform 0.9s ease-out, opacity 0.9s ease-out' : 'none' };

  const labelWrap = {
    position: 'absolute',
    left: '50%', top: `calc(100% + ${10 * m.size}px)`,
    transform: 'translateX(-50%)',
    textAlign: 'center',
    whiteSpace: 'nowrap',
    pointerEvents: 'none',
  };
  const pool = {
    position: 'absolute', left: '50%', top: '50%',
    transform: 'translate(-50%,-50%)',
    width: m.label.length * 17 * m.size + 110,
    height: 150 * m.size,
    borderRadius: '50%',
    background: `radial-gradient(ellipse, rgba(12,17,9,${hover?0.80:0.66}) 0%, rgba(12,17,9,${hover?0.52:0.40}) 38%, rgba(12,17,9,0.14) 64%, rgba(12,17,9,0.0) 82%)`,
    filter: 'blur(13px)',
    transition: 'background 0.4s ease',
    zIndex: 0,
  };
  const name = {
    position: 'relative', zIndex: 1,
    fontFamily: "'Cormorant Garamond', serif",
    fontWeight: 600,
    fontSize: (m.hero ? 48 : 35) * (0.82 + 0.18 * m.size),
    lineHeight: 1.04,
    color: m.gold ? 'var(--gold-bright)' : 'var(--cream)',
    opacity: (hover ? 1 : (m.util ? 0.86 : 0.97)) * ease,
    letterSpacing: '0.014em',
    textShadow: '0 2px 20px rgba(0,0,0,0.95), 0 0 8px rgba(0,0,0,0.85), 0 1px 2px rgba(0,0,0,0.9)',
    transition: 'opacity 0.4s ease, color 0.4s ease',
  };
  const sub = {
    position: 'relative', zIndex: 1,
    fontFamily: "'JetBrains Mono', monospace",
    fontWeight: 400,
    fontSize: (m.hero ? 15 : 12.5) * (0.92 + 0.08 * m.size),
    textTransform: 'uppercase',
    letterSpacing: '0.19em',
    color: m.gold ? 'rgba(245,224,170,1)' : 'rgba(244,236,216,0.95)',
    marginTop: 10 * m.size,
    opacity: (hover ? 1 : (m.util ? 0.84 : 0.94)) * ease,
    textShadow: '0 1px 12px rgba(0,0,0,1), 0 0 5px rgba(0,0,0,0.98)',
    transition: 'opacity 0.4s ease',
  };
  const liveDot = {
    display: 'inline-block', width: 7, height: 7, borderRadius: '50%',
    background: '#7fd98a', marginRight: 8, verticalAlign: 'middle',
    boxShadow: '0 0 8px 2px rgba(127,217,138,0.8)',
    animation: 'lt-pulse 2.1s ease-in-out infinite',
  };

  return (
    <div style={wrap}
         onMouseEnter={() => setHover(true)}
         onMouseLeave={() => setHover(false)}>
      <div style={orb}>
        <div style={seat} />
        <div style={halo} />
        <div style={core} />
        <div style={ring} />
        <div style={pulse2} />
        <div style={pulse} />
        {m.gold && (
          <div style={{ position:'absolute', inset:'-9%', borderRadius:'50%',
            border:'1px solid rgba(243,210,140,0.42)' }} />
        )}
      </div>
      <div style={labelWrap}>
        <div style={pool} />
        <div style={name}>{m.label}</div>
        <div style={sub}>
          {m.live && <span style={liveDot} />}
          {m.sub}
        </div>
      </div>
    </div>
  );
}

/* ---------------------- god-ray streaks ---------------------- */
function GodRays({ t }) {
  const rays = [
    { x: 1180, w: 230, rot: -19, base: 0.16, sp: 0.31, ph: 0 },
    { x: 1340, w: 300, rot:  -7, base: 0.22, sp: 0.24, ph: 1.3 },
    { x: 1480, w: 200, rot:   9, base: 0.14, sp: 0.36, ph: 2.6 },
    { x: 1010, w: 180, rot: -28, base: 0.12, sp: 0.28, ph: 3.5 },
    { x: 1620, w: 250, rot:  21, base: 0.17, sp: 0.21, ph: 4.4 },
    { x: 1280, w: 380, rot:   2, base: 0.20, sp: 0.18, ph: 5.2 },
  ];
  return (
    <div style={{ position:'absolute', inset:0, pointerEvents:'none', overflow:'hidden',
                  mixBlendMode:'screen' }}>
      {rays.map((r, i) => {
        const op = r.base * (0.55 + 0.45 * Math.sin(t * r.sp + r.ph));
        return (
          <div key={i} style={{
            position:'absolute', top:-180, left: r.x, width: r.w, height: 1500,
            transform:`translateX(-50%) rotate(${r.rot}deg)`,
            transformOrigin:'top center',
            background:`linear-gradient(to bottom,
              rgba(255,243,210,${op}) 0%,
              rgba(247,228,180,${op*0.55}) 42%,
              transparent 88%)`,
            filter:'blur(14px)',
          }} />
        );
      })}
    </div>
  );
}

/* ---------------------- chrome corners ---------------------- */
function Chrome({ loaded }) {
  const [clock, setClock] = useState('');
  useEffect(() => {
    const tick = () => {
      const d = new Date();
      let h = d.getHours(); const m = String(d.getMinutes()).padStart(2,'0');
      const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
      setClock(`${h}:${m} ${ap}`);
    };
    tick(); const iv = setInterval(tick, 10000);
    return () => clearInterval(iv);
  }, []);

  const fade = { opacity: Math.max(0, Math.min(1, (loaded - 0.6) / 1.0)),
                 transition: 'opacity 0.6s ease' };
  const soft = { textShadow: '0 2px 14px rgba(0,0,0,0.85)' };

  return (
    <div style={{ position:'absolute', inset:0, pointerEvents:'none', ...fade }}>
      {/* top-left brand */}
      <div style={{ position:'absolute', top:58, left:74 }}>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontSize:46, lineHeight:1,
                      color:'var(--cream)', ...soft }}>
          <span style={{ fontStyle:'italic', fontWeight:500 }}>Living</span>
          <span style={{ fontWeight:600 }}>Tree</span>
        </div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:12.5,
                      letterSpacing:'0.26em', color:'rgba(233,216,168,0.80)',
                      marginTop:11, ...soft }}>
          SALES STUDIO &middot; NORTH BENGALURU
        </div>
      </div>

      {/* top-right clock */}
      <div style={{ position:'absolute', top:60, right:74, textAlign:'right' }}>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:23, fontWeight:400,
                      letterSpacing:'0.10em', color:'var(--cream)', ...soft }}>
          {clock}
        </div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11,
                      letterSpacing:'0.24em', color:'rgba(233,216,168,0.66)',
                      marginTop:8, ...soft }}>
          LIVE
        </div>
      </div>

      {/* bottom band - RERA / tagline / developer, baseline aligned */}
      <div style={{ position:'absolute', bottom:54, left:74, right:74,
                    display:'flex', alignItems:'flex-end',
                    justifyContent:'space-between' }}>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11,
                      letterSpacing:'0.18em', color:'rgba(243,234,211,0.62)',
                      flex:'0 0 auto', ...soft }}>
          RERA &middot; PRM/KA/RERA/1251/309/PR/260924/007084
        </div>
        <div style={{ fontFamily:"'Cormorant Garamond',serif", fontStyle:'italic',
                      fontSize:25, fontWeight:500, color:'rgba(233,216,168,0.92)',
                      flex:'1 1 auto', textAlign:'center', ...soft }}>
          Rooted in Luxury, Branching into the Future
        </div>
        <div style={{ fontFamily:"'JetBrains Mono',monospace", fontSize:11,
                      letterSpacing:'0.20em', color:'rgba(243,234,211,0.62)',
                      flex:'0 0 auto', textAlign:'right', ...soft }}>
          A KALYANI DEVELOPERS PROJECT
        </div>
      </div>
    </div>
  );
}

/* ---------------------- main scene ---------------------- */
function CanopyLight() {
  const scale = useFitScale(2560, 1600);
  const [t, setT] = useState(0);
  const [loaded, setLoaded] = useState(0);
  const [imgIn, setImgIn] = useState(false);
  const [pointer, setPointer] = useState({ x: 0, y: 0 });
  const motes = useRef(makeMotes(46)).current;
  const start = useRef(performance.now());
  const ptTarget = useRef({ x: 0, y: 0 });

  /* animation loop */
  useEffect(() => {
    let raf;
    const loop = () => {
      const elapsed = (performance.now() - start.current) / 1000;
      setT(elapsed);
      setLoaded(Math.min(elapsed, 3.0));
      setPointer(p => ({
        x: p.x + (ptTarget.current.x - p.x) * 0.045,
        y: p.y + (ptTarget.current.y - p.y) * 0.045,
      }));
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
    const it = setTimeout(() => setImgIn(true), 80);
    return () => { cancelAnimationFrame(raf); clearTimeout(it); };
  }, []);

  /* pointer parallax - normalized -1..1 */
  const onMove = useCallback((e) => {
    const nx = (e.clientX / window.innerWidth - 0.5) * 2;
    const ny = (e.clientY / window.innerHeight - 0.5) * 2;
    ptTarget.current = { x: nx, y: ny };
  }, []);

  /* scale + center the fixed stage */
  useEffect(() => {
    const stage = document.getElementById('stage');
    if (stage) stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
  }, [scale]);

  const bgShift = `translate(${-pointer.x * 6}px, ${-pointer.y * 6}px) scale(1.045)`;

  return (
    <div onMouseMove={onMove}
         style={{ position:'absolute', inset:0, overflow:'hidden' }}>

      {/* full-bleed canopy hero */}
      <div style={{
        position:'absolute', inset:'-3%',
        backgroundImage:'url(assets/canopy.png)',
        backgroundSize:'cover', backgroundPosition:'center 38%',
        transform: bgShift,
        opacity: imgIn ? 1 : 0,
        transition:'opacity 1.7s ease',
        filter:'saturate(1.06) brightness(0.92) contrast(1.04)',
      }} />

      {/* deep forest atmospheric wash - tames the bright haze so portals
          become the brightest things on screen */}
      <div style={{
        position:'absolute', inset:0,
        background:`radial-gradient(ellipse 56% 44% at 50% 30%,
            rgba(40,52,30,0.0) 0%, rgba(26,36,22,0.30) 52%, rgba(18,26,15,0.62) 100%),
          linear-gradient(to bottom,
            rgba(22,32,18,0.42) 0%, rgba(22,32,18,0.16) 24%,
            rgba(18,26,15,0.20) 60%, rgba(13,18,10,0.66) 100%)`,
        opacity: imgIn ? 1 : 0, transition:'opacity 1.7s ease',
        pointerEvents:'none',
      }} />
      {/* warm central glow re-lit on top (screen) */}
      <div style={{
        position:'absolute', inset:0,
        background:`radial-gradient(ellipse 42% 34% at 50% 30%,
            rgba(255,232,182,0.34) 0%, rgba(238,202,142,0.12) 44%, transparent 70%)`,
        mixBlendMode:'screen',
        opacity: imgIn ? 1 : 0, transition:'opacity 1.7s ease',
        pointerEvents:'none',
      }} />

      {/* drifting god-rays */}
      <GodRays t={t} />

      {/* floating dust / pollen motes */}
      <svg viewBox="0 0 2560 1600" style={{
        position:'absolute', inset:0, width:'100%', height:'100%',
        pointerEvents:'none', mixBlendMode:'screen' }}>
        {motes.map(mo => {
          const dd = DEPTH[mo.depth];
          const y = ((mo.y - t * mo.sp * 70) % 1700 + 1700) % 1700 - 50;
          const x = mo.x + Math.sin(t * mo.swaySp + mo.ph) * mo.sway
                    - pointer.x * dd.parallax * 0.7;
          const yy = y - pointer.y * dd.parallax * 0.7;
          const op = mo.glow * dd.opacity *
                     (0.5 + 0.5 * Math.sin(t * 0.8 + mo.ph));
          return (
            <circle key={mo.id} cx={x} cy={yy} r={mo.r}
              fill="rgba(255,244,212,1)"
              opacity={op}
              style={{ filter:`blur(${0.4 + mo.depth * 0.9}px)` }} />
          );
        })}
      </svg>

      {/* the 11 portal nodes */}
      {MODULES.map((m) => (
        <Portal key={m.id} m={m} t={t} pointer={pointer} loaded={loaded} />
      ))}

      {/* soft vignette over everything */}
      <div style={{
        position:'absolute', inset:0, pointerEvents:'none',
        background:`radial-gradient(ellipse 74% 70% at 50% 46%,
          transparent 52%, rgba(12,16,9,0.34) 80%, rgba(9,12,6,0.72) 100%)`,
      }} />

      {/* chrome */}
      <Chrome loaded={loaded} />

      {/* gentle initial bloom flash from the centre */}
      <div style={{
        position:'absolute', inset:0, pointerEvents:'none',
        background:'radial-gradient(circle at 50% 33%, rgba(255,247,224,0.85) 0%, transparent 42%)',
        opacity: Math.max(0, 0.5 - loaded * 0.5),
        transition:'opacity 0.2s linear',
        mixBlendMode:'screen',
      }} />
    </div>
  );
}

/* keyframes for the LIVE dot */
const kf = document.createElement('style');
kf.textContent = `@keyframes lt-pulse {
  0%,100% { transform: scale(1); opacity: 1; }
  50%     { transform: scale(1.45); opacity: 0.55; }
}`;
document.head.appendChild(kf);

ReactDOM.createRoot(document.getElementById('stage')).render(<CanopyLight />);
</script>
</body>
</html>
