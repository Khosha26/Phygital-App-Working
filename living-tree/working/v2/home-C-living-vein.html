<style>
  html, body { margin: 0; padding: 0; background: #050a07; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  * { box-sizing: border-box; }

  /* Stage fits viewport with letterboxing */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at center, #0a120d 0%, #050a07 80%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    box-shadow: 0 60px 140px rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
  }

  /* ====== KEYFRAMES ====== */
  @keyframes leafFall {
    0%   { transform: translate(0, 0) rotate(var(--rotS)); }
    100% { transform: translate(var(--driftX), calc(100vh + 80px)) rotate(var(--rotE)); }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes kenBurns {
    0%   { transform: scale(1.0) translate(0, 0); }
    50%  { transform: scale(1.08) translate(-1%, -1.5%); }
    100% { transform: scale(1.0) translate(0, 0); }
  }
  .canopyBg { animation: kenBurns 36s ease-in-out infinite; }

  /* ---- venation draw-in ---- */
  @keyframes veinDraw { to { stroke-dashoffset: 0; } }
  /* whole venation network breathes: a slow brightness pulse */
  @keyframes veinBreathe {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }
  /* travelling sap pulse along midrib + veins */
  @keyframes sapFlow {
    0%   { stroke-dashoffset: 220; opacity: 0; }
    12%  { opacity: 0.9; }
    78%  { opacity: 0.9; }
    100% { stroke-dashoffset: -40; opacity: 0; }
  }
  /* node arrival */
  @keyframes nodeIn {
    0%   { opacity: 0; transform: scale(0.4); }
    70%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* node glow halo breathes */
  @keyframes nodeBreathe {
    0%, 100% { transform: scale(1);    opacity: 0.35; }
    50%      { transform: scale(1.18); opacity: 0.6; }
  }
  /* the leaf-apex source glow */
  @keyframes apexGlow {
    0%, 100% { opacity: 0.4; transform: scale(1); }
    50%      { opacity: 0.75; transform: scale(1.06); }
  }
  /* ring gauge sweep */
  @keyframes ringSweep { to { stroke-dashoffset: var(--ring-target); } }
</style>
<script>
  // Stage scaling — plain JS, runs reliably
  (function() {
    const W = 1440, H = 900;
    function scale() {
      const wrap = document.getElementById("stage-wrap");
      const stage = document.getElementById("stage");
      if (!wrap || !stage) return;
      const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.__ltScale = scale;
    window.addEventListener("resize", scale);
    document.addEventListener("DOMContentLoaded", scale);
    window.addEventListener("load", scale);
  })();
</script>

// ============================================================
// useCount — animated counter (reused hook pattern)
// ============================================================
const useCount = (target, { duration = 1800, delay = 0 } = {}) => {
  const [value, setValue] = React.useState(0);
  React.useEffect(() => {
    let raf, start;
    const startTime = performance.now() + delay;
    const tick = (now) => {
      if (now < startTime) { raf = requestAnimationFrame(tick); return; }
      if (!start) start = now;
      const t = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(target * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, delay]);
  return value;
};

// ============================================================
const VEN_W = 760;
const VEN_H = 488;
const MIDRIB_X = VEN_W / 2;          // 380
const APEX_Y = 40;                   // leaf tip / logo source
const BASE_Y = 470;                  // petiole end

// nodeX/nodeY = the luminous button node at the vein tip.

  { key: "email",     label: "Email Sender",     hint: "Send brochure & details",             Icon: IconEmail,     side:  1, ribY: 396, nodeX: 503, nodeY: 410 },
  { key: "gre",       label: "GRE",              hint: "Guest Relationship Executive",        Icon: IconGRE,       side: -1, ribY: 414, nodeX: 257, nodeY: 426 },

];

// ============================================================
// VENATION NETWORK — the glowing leaf-vein SVG that connects
// the logo apex down the midrib and out to every node.
// Drawn behind the buttons. Breathes subtly.
// ============================================================
const Venation = ({ activeKey }) => {
  // build a soft curved leaf-silhouette outline from node extents
  return (
    <svg width={VEN_W} height={VEN_H} viewBox={`0 0 ${VEN_W} ${VEN_H}`}
         style={{ position: "absolute", left: 0, top: 0, pointerEvents: "none", overflow: "visible" }}>
      <defs>
        <linearGradient id="midribGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"  stopColor="#d9b27a" stopOpacity="0.9"/>
          <stop offset="55%" stopColor="#98DDBC" stopOpacity="0.55"/>
          <stop offset="100%" stopColor="#56A67F" stopOpacity="0.35"/>
        </linearGradient>
        <radialGradient id="apexHalo" cx="50%" cy="50%" r="50%">
          <stop offset="0%"  stopColor="#d9b27a" stopOpacity="0.55"/>
          <stop offset="60%" stopColor="#56A67F" stopOpacity="0.18"/>
          <stop offset="100%" stopColor="#56A67F" stopOpacity="0"/>
        </radialGradient>
        <filter id="veinGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      {/* faint leaf-silhouette envelope — the outer organic boundary */}
      <path
        d={`M ${MIDRIB_X} ${APEX_Y - 8}
            C 545 70, 700 200, 668 300
            C 642 386, 520 470, ${MIDRIB_X} ${BASE_Y + 6}
            C 240 470, 118 386, 92 300
            C 60 200, 215 70, ${MIDRIB_X} ${APEX_Y - 8} Z`}
        fill="rgba(86,166,127,0.045)"
        stroke="rgba(152,221,188,0.16)"
        strokeWidth="1"
        style={{
          strokeDasharray: 2400, strokeDashoffset: 2400,
          animation: "veinDraw 2.6s ease 0.3s forwards",
        }}
      />

      {/* group that breathes as one organism */}
      <g style={{ animation: "veinBreathe 7s ease-in-out 2.6s infinite" }}>
        {/* MIDRIB — central vertical vein */}
        <line x1={MIDRIB_X} y1={APEX_Y} x2={MIDRIB_X} y2={BASE_Y}
          stroke="url(#midribGrad)" strokeWidth="2.4" strokeLinecap="round"
          filter="url(#veinGlow)"
          style={{ strokeDasharray: 460, strokeDashoffset: 460,
                   animation: "veinDraw 1.6s ease 0.4s forwards" }}/>

        {/* SIDE VEINS — one curved branch from midrib to each node */}
        {NODES.map((n, i) => {
          const isActive = activeKey === n.key;
          // control point bows the vein outward like a real leaf rib
          const mx = MIDRIB_X;
          const cpx = mx + n.side * Math.abs(n.nodeX - mx) * 0.42;
          const cpy = (n.ribY + n.nodeY) / 2 - 14;
          const d = `M ${mx} ${n.ribY} Q ${cpx} ${cpy} ${n.nodeX} ${n.nodeY}`;
          return (
            <g key={n.key}>
              <path d={d} fill="none"
                stroke={isActive ? "rgba(217,178,122,0.85)" : "rgba(152,221,188,0.4)"}
                strokeWidth={isActive ? 2 : 1.3}
                strokeLinecap="round"
                filter="url(#veinGlow)"
                style={{
                  strokeDasharray: 320, strokeDashoffset: 320,
                  animation: `veinDraw 1.1s ease ${0.9 + i * 0.085}s forwards`,
                  transition: "stroke 0.4s, stroke-width 0.4s",
                }}/>
              {/* travelling sap pulse along the vein */}
              <path d={d} fill="none"
                stroke="#d9b27a" strokeWidth="2.2" strokeLinecap="round"
                style={{
                  strokeDasharray: "26 320",
                  animation: `sapFlow ${5.5 + (i % 4) * 0.6}s linear ${3 + i * 0.32}s infinite`,
                }}/>
              {/* small junction dot where the vein meets the midrib */}
              <circle cx={mx} cy={n.ribY} r="2.4"
                fill={isActive ? "#d9b27a" : "rgba(152,221,188,0.55)"}
                style={{ transition: "fill 0.4s" }}/>
            </g>
          );
        })}
      </g>

      {/* apex halo — the glowing source where the logo sits */}
      <circle cx={MIDRIB_X} cy={APEX_Y} r="58" fill="url(#apexHalo)"
        style={{ transformOrigin: `${MIDRIB_X}px ${APEX_Y}px`,
                 animation: "apexGlow 6s ease-in-out 2.4s infinite" }}/>
    </svg>
  );
};

// ============================================================
// MenuNode — one luminous circular glass button at a vein tip
// ============================================================
const MenuNode = ({ node, index, hovered, setHovered }) => {
  const isHot = hovered === node.key;
  const DIA = 86;
  // label sits outboard of the node so it never overlaps a vein
  const labelOnLeft = node.side < 0;

    <div
      onMouseEnter={() => setHovered(node.key)}

        position: "absolute",

        transform: "translate(-50%, -50%)",
        width: DIA, height: DIA,

        animation: `nodeIn 0.7s cubic-bezier(0.34,1.4,0.64,1) ${1.4 + index * 0.085}s forwards`,
      }}

      {/* breathing halo behind node */}
      <div style={{
        position: "absolute", left: "50%", top: "50%",
        width: DIA + 26, height: DIA + 26, borderRadius: "50%",
        transform: "translate(-50%,-50%)",
        background: isHot
          ? "radial-gradient(circle, rgba(217,178,122,0.4) 0%, rgba(217,178,122,0) 70%)"
          : "radial-gradient(circle, rgba(152,221,188,0.22) 0%, rgba(152,221,188,0) 70%)",
        animation: "nodeBreathe 5.5s ease-in-out infinite",
        animationDelay: `${index * 0.4}s`,
        pointerEvents: "none",
      }}/>

      {/* the glass button */}
      <div style={{
        position: "relative", width: DIA, height: DIA, borderRadius: "50%",
        background: isHot
          ? "linear-gradient(140deg, rgba(217,178,122,0.95), rgba(184,135,74,0.9))"
          : "rgba(244,234,216,0.055)",
        border: `1px solid ${isHot ? "rgba(217,178,122,0.9)" : "rgba(217,178,122,0.4)"}`,
        backdropFilter: "blur(16px)", WebkitBackdropFilter: "blur(16px)",
        display: "flex", flexDirection: "column",
        alignItems: "center", justifyContent: "center", gap: 3,
        boxShadow: isHot
          ? "0 22px 50px rgba(217,178,122,0.45), inset 0 1px 0 rgba(255,255,255,0.3)"
          : "0 16px 38px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12)",
        transform: isHot ? "scale(1.1)" : "scale(1)",
        transition: "all 0.36s cubic-bezier(0.4,0,0.2,1)",
      }}>
        <node.Icon size={30} stroke={isHot ? "#142019" : "#f4ead8"} strokeWidth={1.5}/>
        <div style={{
          fontSize: 8, fontWeight: 700, letterSpacing: 0.7,
          textTransform: "uppercase",
          color: isHot ? "#142019" : "rgba(244,234,216,0.92)",
          textAlign: "center", lineHeight: 1.05, padding: "0 6px",
          maxWidth: DIA,
        }}>{node.label}</div>
      </div>

      {/* hover hint — flies out to the leaf-edge side */}
      <div style={{
        position: "absolute", top: "50%",
        [labelOnLeft ? "right" : "left"]: DIA + 6,
        transform: `translateY(-50%) translateX(${isHot ? 0 : (labelOnLeft ? 8 : -8)}px)`,
        opacity: isHot ? 1 : 0,
        transition: "all 0.3s ease",
        pointerEvents: "none",
        whiteSpace: "nowrap",
        textAlign: labelOnLeft ? "right" : "left",
      }}>
        <div style={{
          fontFamily: "'Cormorant Garamond', serif", fontStyle: "italic",
          fontSize: 15, color: "#d9b27a", lineHeight: 1.1,
        }}>{node.label}</div>

          fontSize: 9, letterSpacing: 1.2, textTransform: "uppercase",
          color: "rgba(244,234,216,0.6)", marginTop: 2,
        }}>{node.hint}</div>
      </div>
    </div>
  );
};

const RingGauge = ({ pct }) => {
  const R = 38, C = 2 * Math.PI * R;
  const target = C * (1 - pct / 100);
  return (
    <svg width="96" height="96" viewBox="0 0 96 96" style={{ display: "block" }}>
      <defs>
        <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stopColor="#98DDBC"/>
          <stop offset="100%" stopColor="#d9b27a"/>
        </linearGradient>
      </defs>
      <circle cx="48" cy="48" r={R} fill="none"
        stroke="rgba(217,178,122,0.14)" strokeWidth="6"/>
      <circle cx="48" cy="48" r={R} fill="none"
        stroke="url(#ringGrad)" strokeWidth="6" strokeLinecap="round"
        transform="rotate(-90 48 48)"
        style={{
          strokeDasharray: C, strokeDashoffset: C,
          "--ring-target": target,
          animation: "ringSweep 1.7s cubic-bezier(0.22,1,0.36,1) 1.1s forwards",
          filter: "drop-shadow(0 0 5px rgba(152,221,188,0.5))",
        }}/>
    </svg>
  );
};
