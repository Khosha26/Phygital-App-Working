<style>
  html, body { margin: 0; padding: 0; background: #050a07; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  * { box-sizing: border-box; }

  /* Stage fits viewport with letterboxing */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at center, #0a120d 0%, #050a07 80%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    box-shadow: 0 60px 140px rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
  }

  /* ====== KEYFRAMES ====== */
  @keyframes leafFall {
    0%   { transform: translate(0, 0) rotate(var(--rotS)); }
    100% { transform: translate(var(--driftX), calc(100vh + 80px)) rotate(var(--rotE)); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.55; }
    50%      { transform: scale(1.04); opacity: 0.85; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes veinDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes bladeDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes budIn {
    0%   { opacity: 0; transform: scale(0.4); }
    70%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes scaleFadeIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes kenBurns {
    0%   { transform: scale(1.0) translate(0, 0); }
    50%  { transform: scale(1.08) translate(-1%, -1.5%); }
    100% { transform: scale(1.0) translate(0, 0); }
  }
  @keyframes glowPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 0.95; }
  }
  .canopyBg { animation: kenBurns 36s ease-in-out infinite; }
</style>
<script>
  // Stage scaling — plain JS, runs reliably
  (function() {
    const W = 1440, H = 900;
    function scale() {
      const wrap = document.getElementById("stage-wrap");
      const stage = document.getElementById("stage");
      if (!wrap || !stage) return;
      const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.__ltScale = scale;
    window.addEventListener("resize", scale);
    document.addEventListener("DOMContentLoaded", scale);
    window.addEventListener("load", scale);
  })();
</script>

// ============================================================
// useCount — animated counter for the showcase numerals
// ============================================================
const useCount = (target, { duration = 1600, delay = 0 } = {}) => {
  const [value, setValue] = React.useState(0);
  React.useEffect(() => {
    let raf;
    const startTime = performance.now() + delay;
    const tick = (now) => {
      if (now < startTime) { raf = requestAnimationFrame(tick); return; }
      const t = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(target * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, delay]);
  return value;
};

    </div>

};
