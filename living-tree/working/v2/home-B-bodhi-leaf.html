<style>
  html, body { margin: 0; padding: 0; background: #050a07; font-family: Inter, system-ui, sans-serif; overflow: hidden; }
  * { box-sizing: border-box; }

  /* Stage fits viewport with letterboxing */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at center, #0a120d 0%, #050a07 80%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1440px; height: 900px;
    transform-origin: center center;
    transform: translate(-50%, -50%) scale(1);
    box-shadow: 0 60px 140px rgba(0,0,0,0.6);
    border-radius: 2px;
    overflow: hidden;
  }

  /* ====== KEYFRAMES ====== */
  @keyframes leafFall {
    0%   { transform: translate(0, 0) rotate(var(--rotS)); }
    100% { transform: translate(var(--driftX), calc(100vh + 80px)) rotate(var(--rotE)); }
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.5; }
    50%      { transform: scale(1.03); opacity: 0.8; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes dashIn { to { stroke-dashoffset: 0; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleFadeIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  /* nodes settle into the bodhi-leaf outline */
  @keyframes nodeIn {
    0%   { opacity: 0; transform: translate(calc(-50% + var(--ox)), calc(-50% + var(--oy))) scale(0.45); }
    100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }
  }
  @keyframes kenBurns {
    0%   { transform: scale(1.0) translate(0, 0); }
    50%  { transform: scale(1.07) translate(-1%, -1.4%); }
    100% { transform: scale(1.0) translate(0, 0); }
  }
  .canopyBg { animation: kenBurns 40s ease-in-out infinite; }
</style>
<script>
  // Stage scaling — plain JS, runs reliably
  (function() {
    const W = 1440, H = 900;
    function scale() {
      const wrap = document.getElementById("stage-wrap");
      const stage = document.getElementById("stage");
      if (!wrap || !stage) return;
      const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.__ltScale = scale;
    window.addEventListener("resize", scale);
    document.addEventListener("DOMContentLoaded", scale);
    window.addEventListener("load", scale);
  })();
</script>

// useCount — animated counter for the editorial facts
// ============================================================
const useCount = (target, { duration = 1700, delay = 0 } = {}) => {
  const [value, setValue] = React.useState(0);
  React.useEffect(() => {
    let raf;
    const startTime = performance.now() + delay;
    const tick = (now) => {
      if (now < startTime) { raf = requestAnimationFrame(tick); return; }
      const t = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(target * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, delay]);
  return value;
};

const NodeButton = ({ node, index, hovered, setHovered }) => {

  // side — this keeps the leaf cluster inside a clean vertical channel
  // so the editorial facts columns get full room at the stage edges.
  // node.placement: "above" | "below" (top half above, bottom half below).
  const labelAbove = node.placement === "above";
  const labelBelow = !labelAbove;
  const labelLeft = false;
  const labelRight = false;
  return (
    <div
      onMouseEnter={() => setHovered(node.key)}
      onMouseLeave={() => setHovered(null)}

        position: "absolute",
        left: `calc(50% + ${node.x}px)`,

        display: "flex", alignItems: "center", justifyContent: "center",

          : "0 16px 40px rgba(0,0,0,0.42), inset 0 1px 0 rgba(255,255,255,0.12)",
        transform: isHover ? "scale(1.085)" : "scale(1)",
        transition: "transform 0.34s cubic-bezier(0.34,1.3,0.5,1), background 0.3s, box-shadow 0.34s, border-color 0.3s",

          tip + top-notch nodes label above; shoulders label to the side. */}
      <div style={{
        position: "absolute",
        bottom: labelAbove ? D + 9 : "auto",
        top: labelAbove ? "auto" : (labelBelow ? D + 9 : "50%"),
        left: labelLeft ? "auto" : ((labelRight) ? D + 13 : "50%"),
        right: labelLeft ? D + 13 : "auto",
        transform: (labelAbove || labelBelow) ? "translateX(-50%)" : "translateY(-50%)",
        textAlign: labelLeft ? "right" : (labelRight ? "left" : "center"),
        width: 162, pointerEvents: "none",
      }}>
        <div style={{
          fontSize: 11, fontWeight: 600, letterSpacing: 0.6,
          textTransform: "uppercase", color: isHover ? "#f4ead8" : "rgba(244,234,216,0.92)",
          lineHeight: 1.1, transition: "color 0.25s",
