<style>

  /* Stage fits viewport with letterboxing */
  #stage-wrap {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(ellipse at center, #0a120d 0%, #050a07 80%);
  }
  #stage {
    position: absolute; left: 50%; top: 50%;

    transform-origin: center center;

    box-shadow: 0 60px 140px rgba(0,0,0,0.6);

    overflow: hidden;

    0%   { transform: translate(0, 0) rotate(var(--rotS)); }
    100% { transform: translate(var(--driftX), calc(100vh + 80px)) rotate(var(--rotE)); }

  @keyframes breathe {
    0%, 100% { transform: scale(1);    opacity: 0.55; }
    50%      { transform: scale(1.04); opacity: 0.85; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.4); opacity: 0.6; }
  }
  @keyframes veinDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes bladeDraw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes budIn {
    0%   { opacity: 0; transform: scale(0.4); }
    70%  { opacity: 1; }
    100% { opacity: 1; transform: scale(1); }
  }
  @keyframes scaleFadeIn {
    from { opacity: 0; transform: scale(0.7); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(4px); }

    0%   { transform: scale(1.0) translate(0, 0); }
    50%  { transform: scale(1.08) translate(-1%, -1.5%); }
    100% { transform: scale(1.0) translate(0, 0); }

    50%      { opacity: 0.95; }

</style>
<script>
  // Stage scaling — plain JS, runs reliably
  (function() {
    const W = 1440, H = 900;
    function scale() {
      const wrap = document.getElementById("stage-wrap");
      const stage = document.getElementById("stage");
      if (!wrap || !stage) return;
      const s = Math.min(wrap.clientWidth / W, wrap.clientHeight / H);
      stage.style.transform = "translate(-50%, -50%) scale(" + s + ")";
    }
    window.__ltScale = scale;
    window.addEventListener("resize", scale);
    document.addEventListener("DOMContentLoaded", scale);
    window.addEventListener("load", scale);
  })();
</script>

// ---- Branch geometry helpers --------------------------------
// Smooth "C" segments through a list of points (Catmull-Rom -> Bezier).
const segsThrough = (pts) => {
  let d = "";
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[i + 2] || pts[i + 1];
    const c1x = p1.x + (p2.x - p0.x) / 6;
    const c1y = p1.y + (p2.y - p0.y) / 6;
    const c2x = p2.x - (p3.x - p1.x) / 6;
    const c2y = p2.y - (p3.y - p1.y) / 6;
    d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
  }
  return d;
};

// One thin strand running along a tapered limb, offset from the
// spine by `frac` of the local half-width (frac +1 / -1 are the two
// edges, 0 is the centreline). Stacking several strands at different
// fractions builds a thick, textured branch out of pure fine lines
// — no fill, just line-art (the finish carried over from the leaf).
const limbStrand = (spine, wStart, wEnd, frac) => {
  const n = spine.length;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = spine[Math.max(0, i - 1)];
    const b = spine[Math.min(n - 1, i + 1)];
    let tx = b.x - a.x, ty = b.y - a.y;
    const L = Math.hypot(tx, ty) || 1; tx /= L; ty /= L;
    const nx = -ty, ny = tx;                       // unit normal
    const t = n === 1 ? 0 : i / (n - 1);
    const ease = t * t * (3 - 2 * t);              // smoothstep taper
    const hw = (wStart + (wEnd - wStart) * ease) / 2;
    pts.push({ x: spine[i].x + nx * hw * frac, y: spine[i].y + ny * hw * frac });
  }
  return `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}` + segsThrough(pts);
};

// ============================================================
// useCount — animated counter for the showcase numerals
// ============================================================
const useCount = (target, { duration = 1600, delay = 0 } = {}) => {
  const [value, setValue] = React.useState(0);
  React.useEffect(() => {
    let raf;
    const startTime = performance.now() + delay;
    const tick = (now) => {
      if (now < startTime) { raf = requestAnimationFrame(tick); return; }
      const t = Math.min((now - startTime) / duration, 1);
      const eased = 1 - Math.pow(1 - t, 3);
      setValue(target * eased);
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [target, duration, delay]);
  return value;
};

// on its own independent timing.
// ============================================================
const BIRD_W = 82;
const BIRD_H = BIRD_W * 449 / 468;

function Bird({ idx, perches }) {
  const [tf, setTf]       = React.useState(null);   // {x,y} centre in stage coords
  const [dur, setDur]     = React.useState(0);      // transition ms
  const [face, setFace]   = React.useState(1);      // 1 or -1 (flip)
  const [flying, setFly]  = React.useState(true);
  const [shown, setShown] = React.useState(false);

  React.useEffect(() => {
    let alive = true;
    const wait = (ms) => new Promise(r => setTimeout(r, ms));
    (async () => {
      await wait(800 + idx * 1700 + Math.random() * 900);
      while (alive) {
        const p = perches[Math.floor(Math.random() * perches.length)];
        const fromLeft = Math.random() < 0.5;
        const sx = fromLeft ? -150 : STAGE_W + 150;
        const sy = 70 + Math.random() * 240;
        // appear off-screen instantly
        setShown(true); setFly(true); setDur(0);
        setFace(fromLeft ? 1 : -1);
        setTf({ x: sx, y: sy });
        await wait(60); if (!alive) return;
        // fly in to the perch
        const inMs = 2200 + Math.random() * 700;
        setDur(inMs);
        setFace(p.x >= sx ? 1 : -1);
        setTf({ x: p.x, y: p.y });
        await wait(inMs); if (!alive) return;
        // perched — sit still for 3 seconds
        setFly(false);
        await wait(3000); if (!alive) return;
        // fly back out
        const exitLeft = Math.random() < 0.5;
        const ex = exitLeft ? -170 : STAGE_W + 170;
        const ey = 50 + Math.random() * 220;
        const outMs = 1900 + Math.random() * 600;
        setFly(true);
        setFace(ex >= p.x ? 1 : -1);
        setDur(outMs);
        setTf({ x: ex, y: ey });
        await wait(outMs); if (!alive) return;
        setShown(false);
        await wait(1500 + Math.random() * 3600);
      }
    })();
    return () => { alive = false; };
  }, []);

  if (!shown || !tf) return null;
  return (
    <div style={{
      position: "absolute", left: 0, top: 0,
      width: BIRD_W, height: BIRD_H,
      transform: `translate(${tf.x - BIRD_W / 2}px, ${tf.y - BIRD_H / 2}px)`,
      transition: dur ? `transform ${dur}ms cubic-bezier(0.42,0.05,0.5,0.98)` : "none",
      pointerEvents: "none", willChange: "transform",
    }}>
      <div style={{ width: "100%", height: "100%", transform: `scaleX(${face})` }}>
        <div style={{
          width: "100%", height: "100%",
          animation: flying ? "birdBob 0.82s ease-in-out infinite" : "none",
        }}>
          <img src="assets/bird.gif" alt="" style={{
            width: "100%", height: "100%", objectFit: "contain", display: "block",
            filter: "drop-shadow(0 6px 9px rgba(0,0,0,0.45))",
          }}/>
        </div>
      </div>
    </div>
  );
}

const Birds = () => {
  // perch points = button centres in stage coords, lifted so the
  // bird's feet rest on the top rim of the button.
  const perches = React.useMemo(() => BRANCH_NODES.map(n => ({
    x: 60 + n.x,
    y: 150 + n.y - 64,
  })), []);
  return (
    <div style={{
      position: "absolute", inset: 0, overflow: "hidden",
      pointerEvents: "none", zIndex: 9,
    }}>
      {[0, 1, 2, 3, 4].map(i => <Bird key={i} idx={i} perches={perches} />)}
    </div>
  );
};
