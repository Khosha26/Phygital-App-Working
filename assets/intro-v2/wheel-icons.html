<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Embassy Citadel - Wheel Icons</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #D9B97A;
    --ink:  #1A1814;
    --petal:#0E0C09;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ink);
    padding: 48px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px 24px;
    font-family: 'Cinzel', serif;
    color: var(--gold);
    min-height: 100vh;
  }
  .icon-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-align: center;
  }
  .icon-cell .caption {
    opacity: 0.85;
  }
  .icon-cell .sub {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: none;
    opacity: 0.55;
    max-width: 140px;
    line-height: 1.4;
  }
  .icon {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 25%, rgba(217,185,122,0.08), transparent 60%),
      var(--petal);
    border: 1px solid rgba(217,185,122,0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    outline: none;
    cursor: pointer;
    transition: border-color 240ms ease, box-shadow 240ms ease;
  }
  .icon:hover,
  .icon:focus-visible {
    border-color: rgba(217,185,122,0.55);
    box-shadow: 0 0 24px rgba(217,185,122,0.18);
  }
  .icon svg {
    width: 48px;
    height: 48px;
    display: block;
    overflow: visible;
  }
  .icon svg * {
    stroke: var(--gold);
    stroke-width: 1.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    vector-effect: non-scaling-stroke;
  }
  .icon svg .solid,
  .icon svg rect.f-room {
    fill: var(--gold) !important;
    stroke: none !important;
  }

  /* ---------- Idle breathing (staggered) ---------- */
  @keyframes breathe {
    0%, 100% { transform: scale(1.00); }
    50%      { transform: scale(1.02); }
  }
  .icon svg {
    transform-origin: 50% 50%;
    animation: breathe 4s ease-in-out infinite;
  }
  .icon-gallery     svg { animation-delay: 0.0s; }
  .icon-floorplan   svg { animation-delay: 0.4s; }
  .icon-masterplan  svg { animation-delay: 0.8s; }
  .icon-inventory   svg { animation-delay: 1.2s; }
  .icon-tools       svg { animation-delay: 1.6s; }
  .icon-amenities   svg { animation-delay: 2.0s; }
  .icon-about       svg { animation-delay: 2.4s; }

  /* ---------- Per-icon hover keyframes ---------- */

  /* Gallery: sun rises + shutter blink */
  @keyframes sun-rise {
    0%   { transform: translateY(0); }
    50%  { transform: translateY(-1.2px); }
    100% { transform: translateY(0); }
  }
  @keyframes shutter-blink {
    0%, 80%, 100% { opacity: 1; }
    88%           { opacity: 0.15; }
  }
  .icon-gallery .g-sun    { transform-origin: 50% 50%; transform-box: fill-box; }
  .icon-gallery .g-frame  { transform-origin: 50% 50%; transform-box: fill-box; }
  .icon-gallery:hover .g-sun,
  .icon-gallery:focus-visible .g-sun {
    animation: sun-rise 1.4s ease-in-out infinite;
  }
  .icon-gallery:hover .g-frame,
  .icon-gallery:focus-visible .g-frame {
    animation: shutter-blink 1.4s ease-in-out infinite;
  }

  /* Floorplan: room fills briefly */
  @keyframes room-fill {
    0%, 100% { opacity: 0; }
    40%, 60% { opacity: 0.55; }
  }
  .icon-floorplan .f-room {
    fill: var(--gold);
    stroke: none;
    opacity: 0;
  }
  .icon-floorplan:hover .f-room,
  .icon-floorplan:focus-visible .f-room {
    animation: room-fill 1.6s ease-in-out infinite;
  }

  /* Master Plan: pin bobs */
  @keyframes pin-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-2px); }
  }
  .icon-masterplan .mp-pin { transform-origin: 50% 100%; transform-box: fill-box; }
  .icon-masterplan:hover .mp-pin,
  .icon-masterplan:focus-visible .mp-pin {
    animation: pin-bob 1.0s ease-in-out infinite;
  }

  /* Inventory: windows flicker */
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.25; }
  }
  .icon-inventory .w-a { animation-duration: 0.9s; }
  .icon-inventory .w-b { animation-duration: 1.1s; animation-delay: 0.15s; }
  .icon-inventory .w-c { animation-duration: 1.0s; animation-delay: 0.30s; }
  .icon-inventory .w-d { animation-duration: 1.2s; animation-delay: 0.45s; }
  .icon-inventory:hover .win,
  .icon-inventory:focus-visible .win {
    animation-name: flicker;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }

  /* Tools: crossed tools rotate opposing */
  @keyframes tool-l { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-10deg); } }
  @keyframes tool-r { 0%,100% { transform: rotate(0); } 50% { transform: rotate(10deg);  } }
  .icon-tools .t-left  { transform-origin: 50% 50%; transform-box: fill-box; }
  .icon-tools .t-right { transform-origin: 50% 50%; transform-box: fill-box; }
  .icon-tools:hover .t-left,
  .icon-tools:focus-visible .t-left {
    animation: tool-l 1.2s ease-in-out infinite;
  }
  .icon-tools:hover .t-right,
  .icon-tools:focus-visible .t-right {
    animation: tool-r 1.2s ease-in-out infinite;
  }

  /* Amenities: leaf sways */
  @keyframes leaf-sway {
    0%, 100% { transform: rotate(-8deg); }
    50%      { transform: rotate(8deg);  }
  }
  .icon-amenities .leaf { transform-origin: 50% 100%; transform-box: fill-box; }
  .icon-amenities:hover .leaf,
  .icon-amenities:focus-visible .leaf {
    animation: leaf-sway 1.6s ease-in-out infinite;
  }

  /* About: head tilts */
  @keyframes head-tilt {
    0%, 100% { transform: rotate(-5deg); }
    50%      { transform: rotate(5deg);  }
  }
  .icon-about .head { transform-origin: 50% 100%; transform-box: fill-box; }
  .icon-about:hover .head,
  .icon-about:focus-visible .head {
    animation: head-tilt 1.4s ease-in-out infinite;
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .icon svg,
    .icon svg * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>

  <!-- 1. GALLERY -->
  <div class="icon-cell">
    <div class="icon icon-gallery" tabindex="0" aria-label="Gallery">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- frame -->
        <rect class="g-frame" x="3" y="5" width="18" height="14" rx="1.2"/>
        <!-- mountains -->
        <path d="M5 16 L9.5 10.5 L13 14.5 L15.5 12 L19 16"/>
        <!-- sun -->
        <circle class="g-sun" cx="8" cy="9.2" r="1.2"/>
      </svg>
    </div>
    <div class="caption">Gallery</div>
    <div class="sub">Explore stunning visuals</div>
  </div>

  <!-- 2. FLOORPLAN -->
  <div class="icon-cell">
    <div class="icon icon-floorplan" tabindex="0" aria-label="Floor plan">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- room fill highlight (drawn first, behind strokes) -->
        <rect class="f-room" x="4" y="4" width="7.5" height="7.5" rx="0.4"/>
        <!-- outer wall -->
        <rect x="4" y="4" width="16" height="16" rx="0.6"/>
        <!-- internal divisions -->
        <path d="M11.5 4 L11.5 11.5"/>
        <path d="M4 11.5 L20 11.5"/>
        <path d="M15.5 11.5 L15.5 20"/>
      </svg>
    </div>
    <div class="caption">Floorplan</div>
    <div class="sub">View detailed floor plans</div>
  </div>

  <!-- 3. MASTER PLAN -->
  <div class="icon-cell">
    <div class="icon icon-masterplan" tabindex="0" aria-label="Master plan">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="mp-pin">
          <!-- teardrop pin -->
          <path d="M12 21 C 12 21 5 13.8 5 9.5 a7 7 0 0 1 14 0 C 19 13.8 12 21 12 21 Z"/>
          <!-- inner dot -->
          <circle class="solid" cx="12" cy="9.4" r="1.6"/>
        </g>
      </svg>
    </div>
    <div class="caption">Master Plan</div>
    <div class="sub">Explore the community layout</div>
  </div>

  <!-- 4. INVENTORY -->
  <div class="icon-cell">
    <div class="icon icon-inventory" tabindex="0" aria-label="Inventory">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- tall building outline -->
        <path d="M7 21 L7 5 L17 5 L17 21"/>
        <path d="M5 21 L19 21"/>
        <!-- windows: two columns x four rows -->
        <rect class="win w-a" x="8.5"  y="7"  width="2.2" height="2"/>
        <rect class="win w-b" x="13.3" y="7"  width="2.2" height="2"/>
        <rect class="win w-c" x="8.5"  y="10.5" width="2.2" height="2"/>
        <rect class="win w-d" x="13.3" y="10.5" width="2.2" height="2"/>
        <rect class="win w-a" x="8.5"  y="14" width="2.2" height="2"/>
        <rect class="win w-b" x="13.3" y="14" width="2.2" height="2"/>
        <!-- entry -->
        <path d="M10.8 21 L10.8 18 L13.2 18 L13.2 21"/>
      </svg>
    </div>
    <div class="caption">Inventory</div>
    <div class="sub">Check availability &amp; unit details</div>
  </div>

  <!-- 5. TOOLS -->
  <div class="icon-cell">
    <div class="icon icon-tools" tabindex="0" aria-label="Tools">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- wrench: diagonal top-left to bottom-right -->
        <g class="t-left">
          <!-- open jaw head (C-shape) at top-left -->
          <path d="M7.8 3.2 a2.6 2.6 0 1 0 1.8 4.4"/>
          <!-- handle running diagonally -->
          <path d="M9.6 7.6 L18.6 16.6"/>
          <!-- grip end -->
          <circle cx="19.4" cy="17.4" r="1.4"/>
        </g>
        <!-- screwdriver: diagonal top-right to bottom-left -->
        <g class="t-right">
          <!-- handle (small rectangle at top-right, drawn as a rotated bar) -->
          <path d="M17.4 3.6 L20.6 6.8 L18.6 8.8 L15.4 5.6 Z"/>
          <!-- shaft -->
          <path d="M15.4 5.6 L6 15"/>
          <!-- chisel tip -->
          <path d="M6 15 L4 17 L6.5 17.5 Z"/>
        </g>
      </svg>
    </div>
    <div class="caption">Tools</div>
    <div class="sub">Helpful tools for smart decisions</div>
  </div>

  <!-- 6. AMENITIES -->
  <div class="icon-cell">
    <div class="icon icon-amenities" tabindex="0" aria-label="Amenities">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <g class="leaf">
          <!-- leaf body -->
          <path d="M5.5 18.5 C 5.5 10.5 11 5 18.5 5 C 18.5 12.5 13 18 5.5 18.5 Z"/>
          <!-- midrib -->
          <path d="M5.5 18.5 L18.5 5"/>
        </g>
      </svg>
    </div>
    <div class="caption">Amenities</div>
    <div class="sub">Lifestyle &amp; world class amenities</div>
  </div>

  <!-- 7. ABOUT US -->
  <div class="icon-cell">
    <div class="icon icon-about" tabindex="0" aria-label="About us">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- head -->
        <circle class="head" cx="12" cy="8.5" r="3.2"/>
        <!-- shoulders -->
        <path d="M4.5 20 C 4.5 15.6 8 13.5 12 13.5 C 16 13.5 19.5 15.6 19.5 20"/>
      </svg>
    </div>
    <div class="caption">About Us</div>
    <div class="sub">Know more about Embassy Group</div>
  </div>

</body>
</html>
